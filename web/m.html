<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f0f2f8">
<title>Fungi</title>
<link rel="stylesheet" href="/m.css">
<script src="/vendor/marked.min.js"></script>
</head><body>
<div id="rescan-overlay"><div class="rescan-card">
  <div class="rescan-icon">&#x26A0;</div>
  <p>链接已失效或 token 不对。</p>
  <p class="rescan-hint">请回到电脑端 GUI「手机端」页重新扫码。</p>
</div></div>
<div id="app">
  <main id="chat-page">
    <header id="topbar">
      <button id="btn-menu" title="会话列表">&#x2630;</button>
      <button id="btn-back" title="返回会话" hidden>&#x2190;</button>
      <div id="title-wrap">
        <strong id="session-title">Fungi</strong>
        <select id="model-select" title="当前模型：下拉即切换，切换后自动测一次调用"></select>
      </div>
      <span id="tok-rate" title="输出速率：每秒输出 token 数（流式 chunk ≈ 1 token）；停笔停在最后一个数，新会话才清空"></span>
      <button id="theme-switch" title="切换深浅主题">
        <svg class="theme-ic ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-ic ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <div id="friend-bar" class="hidden">
      <span class="friend-bar-label">来自该好友的权限请求</span>
      <div id="consent-seg">
        <button data-v="allow">允许</button>
        <button data-v="ask" class="on">询问</button>
      </div>
    </div>
    <div id="asks-banner"></div>
    <div id="chat-wrap">
      <div id="agent-tray"></div>
      <div id="messages"></div>
      <button id="scroll-bottom" title="回到底部">&#x2193;</button>
    </div>
    <div id="status"></div>
    <div id="input-area">
      <input type="file" id="file-input" multiple hidden>
      <textarea id="input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
      <button id="btn-file" title="发送文件">&#x1F4CE;</button>
      <button id="btn-send" title="发送">&#x2191;</button>
    </div>
    <div id="friend-input-area" class="hidden">
      <input type="file" id="friend-file-input" multiple hidden>
      <textarea id="friend-input" rows="1" placeholder="给好友发消息…" autocomplete="off"></textarea>
      <button id="friend-file" title="发文件">&#x1F4CE;</button>
      <button id="friend-send" title="发送">&#x2191;</button>
    </div>
    <div id="drawer-scrim"></div>
  </main>
  <aside id="drawer">
    <div class="drawer-header">
      <div class="drawer-brand"><span class="dot"></span><strong>Fungi</strong></div>
      <button id="btn-new-session">&#xFF0B; 新会话</button>
    </div>
    <div class="drawer-filter"><input type="text" id="session-filter" placeholder="筛选会话…" autocomplete="off" spellcheck="false"></div>
    <div id="session-list"><div id="session-list-empty">还没有会话。<br>点「＋ 新会话」开始。</div></div>
    <div id="friends-header">好友 <span id="friends-count"></span></div>
    <div id="friend-list"></div>
    <div id="friends-empty">房间暂无其他主机。</div>
  </aside>
</div>
<div id="confirm-overlay"><div id="confirm-modal" role="dialog" aria-modal="true">
  <h2 id="confirm-title"></h2>
  <p id="confirm-message"></p>
  <div class="confirm-actions"><button id="confirm-cancel"></button><button id="confirm-ok"></button></div>
</div></div>
<div id="xfer-overlay"><div id="xfer-modal" role="dialog" aria-modal="true" aria-labelledby="xfer-title">
  <h2 id="xfer-title"></h2>
  <div id="xfer-steps"></div>
  <div class="xfer-actions"><button id="xfer-close">关闭</button></div>
</div></div>
<div id="agent-modal-overlay"></div>
<script src="/vendor/gsap.min.js"></script>
<script src="/common.js"></script>
<script src="/m.js"></script>
</body></html>
