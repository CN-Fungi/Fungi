[project]
name = "fungi"
version = "0.7.4"
description = "Fungi — LAN multi-host Orchestrator network built on the YESIR TriLayer agent harness"
requires-python = ">=3.13"
# comtypes drives UI Automation for the screen tool (spec §35): pure Python, and
# PyInstaller ships a hook for comtypes.client, so the frozen exe keeps working.
dependencies = ["segno>=1.6", "pillow>=10.0", "comtypes>=1.4"]

[project.optional-dependencies]
# Dev tooling. CI reads these pins from here (.github/workflows/ci.yml), so a
# new ruff rule or a new browser build cannot redden an untouched tree.
# playwright drives the web UI tests (tests/test_webui_friend.py).
dev = ["pytest", "ruff==0.13.0", "playwright==1.61.0"]
# Qt is needed by the GUI and the tray only (gui.py / tray.py import PyQt5 +
# qfluentwidgets at module scope; __main__.py lazily in room mode). Every
# headless path — CLI single-shot, hub/server, WebUI runtime, and CI (where the
# Qt tests importorskip) — runs without it, so it stays an extra.
gui = ["PyQt5>=5.15", "PyQt-Fluent-Widgets"]
# Runtime of the `video` tool: tools/video.py gates on these via find_spec and
# prints the pip line when one is missing; the imports themselves live in the
# vendored vidsense/ package, which Fungi runs as a subprocess.
video = [
    "huggingface_hub",
    "torch",
    "transformers",
    "faster-whisper",
    "opencv-python",
    "static-ffmpeg",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["web", "sessions", "docs", "vidsense", "shots"]  # vidsense = vendored upstream; shots = scratch scripts

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PL",  # pylint
    "ARG", # unused arguments
    "PTH", # use pathlib
    "RET", # return simplification
]
ignore = [
    "E501",    # line length (ruff format already keeps code wrapped)
    "PLR0911", # too many return statements (tool dispatch)
    "PLR0912", # too many branches (UI/server dispatch)
    "PLR0913", # too many arguments (tool signatures)
    "PLR0915", # too many statements (ported handlers)
    "PLR2004", # magic values (protocol constants)
    "SIM108",  # ternary instead of if/else (readability)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Chinese UI literals (tray menu / notifications / GUI) are intentional
"fungi/tray.py" = ["RUF001", "RUF002", "RUF003"]
"fungi/gui/**" = ["RUF001", "RUF002", "RUF003"]  # the whole GUI package, now that it is one
# …and so is the Chinese prose inside the prompts the courier/local agents get
"fungi/clone/comm.py" = ["RUF001"]
"fungi/tools/ask.py" = ["RUF001"]
# …and the screen tool's ask cards + tray hints (spec §35) are Chinese too
"fungi/tools/screen.py" = ["RUF001"]
# …and the ghostworld connector's player-facing labels + error lines (spec §43)
"fungi/tools/ghostworld.py" = ["RUF001", "RUF002", "RUF003"]
# …and the warning a hand-edited config.json gets when it does not parse
"fungi/config.py" = ["RUF001"]
# Tests: Chinese docstrings and test data (RUF00x), deferred imports of optional
# deps and fixtures (PLC0415), unused fixture/lambda arguments (ARG*), and
# class-level lookup tables (RUF012) are all deliberate test idioms here.
"tests/**" = ["RUF001", "RUF002", "RUF003", "PLC0415", "ARG001", "ARG002", "ARG005", "RUF012"]
