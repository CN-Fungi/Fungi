name: Release

# Tag a release: git tag vX.Y.Z && git push origin vX.Y.Z
# (push: sleep 3 -> git -c http.proxy=http://127.0.0.1:7897 push origin vX.Y.Z)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install pytest pillow segno comtypes PyQt5 PyQt-Fluent-Widgets pyinstaller

      # Same gate as CI (pytest only — see ci.yml for the ruff drift note).
      - name: Run tests
        run: python -m pytest tests -q

      # Tracked files only: config.json (real API key) is gitignored, so it
      # never enters the archive.
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          name="fungi-${GITHUB_REF_NAME}-source.zip"
          git archive --format=zip --prefix="fungi-${GITHUB_REF_NAME#v}/" -o "$name" HEAD
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
      # GUI exe (PyInstaller, onedir): web/ static assets ride along via
      # --add-data (assets/ too: the ringtones the GUI's 铃声 setting plays);
      # fungi/config.py resolves user data next to the exe when frozen.
      # Foreign Qt bindings are excluded so hooks never collide.
      # --icon: the mushroom the tray draws must also live in the exe, or
      # Explorer and the taskbar fall back to PyInstaller's default icon. The
      # flag was dropped by accident in 0066456 (2026-09-11, user report).
      - name: Build Windows exe
        run: >
          python -m PyInstaller --noconfirm --noconsole --name Fungi start.py
          --icon assets/fungi.ico
          --add-data "web;web" --add-data "assets;assets" --add-data "pyproject.toml;."
          --collect-all qfluentwidgets --collect-all vidsense --collect-all segno
          --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6
          --exclude-module shiboken2 --exclude-module shiboken6

      # The two documents a tester gets sent for travel at the top of the
      # bundle (next to Fungi.exe), not through --add-data: onedir would bury
      # them in _internal/, where nobody looks. The detailed README is not
      # copied here: it ships in the source zip, for readers of the source.
      - name: Zip exe bundle
        shell: pwsh
        run: |
          Copy-Item README.md dist/Fungi/
          New-Item -ItemType Directory -Force dist/Fungi/docs | Out-Null
          Copy-Item "docs/测试人员必看！.docx" dist/Fungi/docs/
          Compress-Archive -Path dist/Fungi -DestinationPath "fungi-$($env:GITHUB_REF_NAME)-windows-x64.zip"

      # A file can drop out of the bundle without failing the build (--icon
      # did, 0066456), so assert both documents are in the zip we publish.
      - name: Check the bundle carries both documents
        shell: python
        run: |
          import os, zipfile
          archive = zipfile.ZipFile("fungi-%s-windows-x64.zip" % os.environ["GITHUB_REF_NAME"])
          names = archive.namelist()
          assert "Fungi/README.md" in names, names
          guide = [n for n in names if n.startswith("Fungi/docs/")]
          assert len(guide) == 1 and guide[0].endswith(".docx"), names
          print("bundled:", ascii(guide[0]), archive.getinfo(guide[0]).file_size, "bytes")

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            fungi-v*-windows-x64.zip
          generate_release_notes: true
